services:
  postgres:
    image: postgres:17
    container_name: finsight-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "55432:5432"

    volumes:
      - finsight-postgres-data:/var/lib/postgresql/data

volumes:
  finsight-postgres-data: