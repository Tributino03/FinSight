services:
  postgres:
    image: postgres:17
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finsight-postgres-data:/var/lib/postgresql/data

volumes:
  finsight-postgres-data: